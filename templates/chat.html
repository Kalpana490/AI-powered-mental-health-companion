{% extends "base.html" %}
{% block content %}
<h2>Chat with Mental Health Assistant</h2>

<div id="chat-box" class="chat-box"></div>

<div class="chat-input">
  <input type="text" id="user-input" placeholder="Type your message..." autofocus>

  <!-- 🎤 Mic Button -->
  <button id="mic-btn" onclick="startListening()">🎤</button>

  <button onclick="sendMessage()">Send</button>
</div>

<script>
// ------------------------------
// SEND MESSAGE FUNCTION
// ------------------------------
async function sendMessage() {
  const input = document.getElementById('user-input');
  const chatBox = document.getElementById('chat-box');
  const userMessage = input.value.trim();
  if (!userMessage) return;

  chatBox.innerHTML += `<p><strong>You:</strong> ${userMessage}</p>`;
  input.value = '';

  // Typing indicator
  const typingMsg = document.createElement("p");
  typingMsg.id = "typing-indicator";
  typingMsg.innerHTML = `<em>Bot is typing...</em>`;
  chatBox.appendChild(typingMsg);
  chatBox.scrollTop = chatBox.scrollHeight;

  try {
    const res = await fetch('/chat_api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: userMessage })
    });

    const data = await res.json();
    typingMsg.remove();

    let reply = data.response.replace(/^(AI:|Agent:)\s*/i, '');

    chatBox.innerHTML += `<p><strong>AI:</strong> ${reply} <em>(${data.sentiment})</em></p>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  } catch (err) {
    typingMsg.remove();
    chatBox.innerHTML += `<p class="error">❌ Error getting response.</p>`;
  }
}



// ------------------------------
// SPEECH RECOGNITION (Web Speech API)
// ------------------------------
let recognition;
let isListening = false;

if ("webkitSpeechRecognition" in window) {
  recognition = new webkitSpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = "en-US";

  recognition.onstart = () => {
    isListening = true;
    document.getElementById("mic-btn").style.background = "#4f46e5";
    document.getElementById("mic-btn").style.color = "white";
  };

  recognition.onend = () => {
    isListening = false;
    document.getElementById("mic-btn").style.background = "";
    document.getElementById("mic-btn").style.color = "";
  };

  recognition.onresult = (event) => {
    const speechText = event.results[0][0].transcript;
    document.getElementById("user-input").value = speechText;

    // Auto-send message immediately:
    sendMessage();
  };
}


// ------------------------------
// START LISTENING BUTTON
// ------------------------------
function startListening() {
  if (!recognition) {
    alert("Speech recognition not supported in this browser.");
    return;
  }

  if (!isListening) {
    recognition.start();
  } else {
    recognition.stop();
  }
}
</script>

<style>
/* Style mic button */
#mic-btn {
  margin-right: 10px;
  margin-left: 10px;
  padding: 8px 12px;
  font-size: 18px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: #e5e5e5;
  transition: 0.2s;
}

#mic-btn:hover {
  background: #d0d0d0;
}
</style>

{% endblock %}
