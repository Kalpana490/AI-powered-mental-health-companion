{% extends "base.html" %}
{% block content %}
<h2>Text-Based Stress Check</h2>

<form method="POST" action="{{ url_for('vader_stress') }}">

  <!-- Textarea -->
  <textarea id="user_text" name="user_text"
            placeholder="How are you feeling today?"
            required rows="5" cols="50"></textarea><br>

  <!-- 🎤 Speech Input Button -->
  <button type="button" id="mic-btn" onclick="startListening()">🎤 Speak</button>

  <!-- Submit Button -->
  <button type="submit">Analyze</button>

</form>

{% if sentiment %}
  <p class="result">Your emotional tone is <strong>{{ sentiment }}</strong>.</p>
{% endif %}

<script>
// ------------------------------------
// SPEECH RECOGNITION
// ------------------------------------
let recognition;
let isListening = false;

if ("webkitSpeechRecognition" in window) {
    recognition = new webkitSpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = "en-US";

    recognition.onstart = () => {
        isListening = true;
        document.getElementById("mic-btn").style.background = "#4f46e5";
        document.getElementById("mic-btn").style.color = "white";
        document.getElementById("mic-btn").innerText = "🎤 Listening...";
    };

    recognition.onend = () => {
        isListening = false;
        document.getElementById("mic-btn").style.background = "";
        document.getElementById("mic-btn").style.color = "";
        document.getElementById("mic-btn").innerText = "🎤 Speak";
    };

    recognition.onresult = (event) => {
        const speechText = event.results[0][0].transcript;

        // Insert spoken text into textarea
        const textarea = document.getElementById("user_text");
        textarea.value = speechText;

        // Automatically scroll if needed
        textarea.scrollTop = textarea.scrollHeight;
    };
}

function startListening() {
    if (!recognition) {
        alert("Speech recognition not supported in this browser.");
        return;
    }

    if (!isListening) recognition.start();
    else recognition.stop();
}
</script>

<style>
/* 🎤 Mic button style */
#mic-btn {
    margin-right: 10px;
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    background: #e5e5e5;
    font-size: 16px;
    transition: 0.3s;
}

#mic-btn:hover {
    background: #d0d0d0;
}
</style>

{% endblock %}
